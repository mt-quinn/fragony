<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Testworks presentation review</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#182127;color:#e7e8dc;font:12px Arial}canvas{display:block}nav{position:fixed;top:14px;left:14px;display:flex;gap:7px;align-items:center;padding:9px;background:#182127dc;border:1px solid #6d7d73}button,select{background:#35453e;color:#efefdf;border:1px solid #819387;padding:8px;font:inherit}#info{position:fixed;bottom:12px;left:14px;background:#182127dc;padding:8px;letter-spacing:.08em}</style></head><body><nav><select id="view"></select><button id="actors">ACTORS ON</button><button id="quality">BALANCED</button><button id="reverse">REVERSE</button><button id="free">FREE CAMERA OFF</button><button id="hide">HIDE TOOLS</button></nav><div id="info"></div><script type="module">
import * as THREE from '../dist/vendor/three.module.js';
import {buildTestworks,TESTWORKS_VIEWS,setArenaAtmosphere} from '../dist/testworks.js';
import {MAP,selectMap} from '../dist/map.js';
import {FrameRenderer,surface,studioEnvironment} from '../dist/presentation.js';
import {createDummyRig,poseDummy} from '../dist/characters.js';
selectMap('testworks');const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x182127);scene.fog=new THREE.Fog(0x182127,38,120);scene.environment=studioEnvironment(renderer).texture;scene.environmentIntensity=.34;
const camera=new THREE.PerspectiveCamera(85,innerWidth/innerHeight,.07,160);scene.add(camera);scene.add(new THREE.HemisphereLight(0xf7f8f0,0x65717c,1));const sun=new THREE.DirectionalLight(0xfff2d6,2.8);sun.position.set(-24,52,24);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-57,right:57,top:57,bottom:-57,near:1,far:125});sun.shadow.bias=-.003;sun.shadow.normalBias=.08;scene.add(sun);
setArenaAtmosphere(scene,MAP);const arena=new THREE.Group();scene.add(arena);const blocks=[],world=[];buildTestworks(arena,MAP,blocks,world);const actors=new THREE.Group();scene.add(actors);
for(const [x,y,z]of[[-23,0,2],[-31,4,-15],[2,0,1],[6,0,-9],[21,0,-8],[33,4,-8],[26,8,-28],[-9,0,-27],[-14,0,25],[17,0,29]]){const rig=createDummyRig({mat:surface,target:()=>{}});rig.group.position.set(x,y,z);rig.group.rotation.y=Math.PI/4;rig.group.traverse(m=>{if(m.userData.healthShell)m.material=surface(z<0?0x52d93c:0xd9d13c)});poseDummy(rig,{crouch:x===21?1:0});actors.add(rig.group);}
let frame=new FrameRenderer(renderer,scene,camera,{ao:true,bloom:true}),reviewAO=frame.gtao,view=0,reverse=false,battery=false;const select=document.querySelector('#view');for(const [i,v]of TESTWORKS_VIEWS.entries())select.add(new Option(v.label,i));
function setView(){const v=TESTWORKS_VIEWS[view];camera.position.fromArray(reverse?v.target:v.position);camera.lookAt(new THREE.Vector3(...(reverse?v.position:v.target)));camera.updateMatrixWorld(true);}
select.onchange=()=>{view=+select.value;reverse=false;setView()};document.querySelector('#reverse').onclick=()=>{reverse=!reverse;setView()};document.querySelector('#actors').onclick=e=>{actors.visible=!actors.visible;e.target.textContent='ACTORS '+(actors.visible?'ON':'OFF')};document.querySelector('#quality').onclick=e=>{battery=!battery;e.target.textContent=battery?'BATTERY':'BALANCED';frame.gtao=battery?null:reviewAO;frame.output.uniforms.aoAmount.value=battery?0:.65;renderer.shadowMap.enabled=!battery;frame.bloomEnabled=!battery;frame.output.uniforms.bloomAmount.value=battery?0:1;};document.querySelector('#hide').onclick=()=>{document.querySelector('nav').hidden=true;document.querySelector('#info').hidden=true;};setView();
let free=false;document.querySelector('#free').onclick=e=>{free=!free;keys.clear();e.target.textContent='FREE CAMERA '+(free?'ON':'OFF');};let dragging=false,last;renderer.domElement.onpointerdown=e=>{if(!free)return;dragging=true;last=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>dragging=false;renderer.domElement.onpointermove=e=>{if(!free||!dragging)return;const a=new THREE.Euler().setFromQuaternion(camera.quaternion,'YXZ');a.y-=(e.clientX-last[0])*.003;a.x=Math.max(-1.4,Math.min(1.4,a.x-(e.clientY-last[1])*.003));camera.quaternion.setFromEuler(a);last=[e.clientX,e.clientY]};
const keys=new Set();onkeydown=e=>keys.add(e.code);onkeyup=e=>keys.delete(e.code);let old=performance.now();renderer.info.autoReset=false;renderer.setAnimationLoop(now=>{const dt=Math.min((now-old)/1000,.1);old=now;const d=new THREE.Vector3((keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),0,(keys.has('KeyS')?1:0)-(keys.has('KeyW')?1:0));d.applyQuaternion(camera.quaternion);if(free)camera.position.addScaledVector(d,dt*8);renderer.info.reset();frame.render(scene,camera,dt);document.querySelector('#info').textContent=TESTWORKS_VIEWS[view].label+' / '+renderer.info.render.calls+' total calls / '+renderer.info.render.triangles+' triangles / '+camera.position.toArray().map(v=>v.toFixed(1)).join(', ');});
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);frame.resize()};
</script></body></html>

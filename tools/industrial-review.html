<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Industrial maps presentation review</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#182127;color:#e7e8dc;font:12px Arial}canvas{display:block}nav{position:fixed;top:14px;left:14px;display:flex;gap:7px;align-items:center;padding:9px;background:#182127dc;border:1px solid #6d7d73}button,select{background:#35453e;color:#efefdf;border:1px solid #819387;padding:8px;font:inherit}#info{position:fixed;bottom:12px;left:14px;background:#182127dc;padding:8px;letter-spacing:.08em}</style></head><body><nav><select id="map"></select><select id="view"></select><button id="actors">ACTORS ON</button><button id="quality">BALANCED</button><button id="reverse">REVERSE</button><button id="free">FREE CAMERA OFF</button><button id="hide">HIDE TOOLS</button></nav><div id="info"></div><script type="module">
import * as THREE from '../dist/vendor/three.module.js';
import {buildTestworks,TESTWORKS_VIEWS,setArenaAtmosphere} from '../dist/testworks.js';

selectMap('tidal-lock');const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x182127);scene.fog=new THREE.Fog(0x182127,38,120);scene.environment=studioEnvironment(renderer).texture;scene.environmentIntensity=.34;
const camera=new THREE.PerspectiveCamera(85,innerWidth/innerHeight,.07,160);scene.add(camera);scene.add(new THREE.HemisphereLight(0xf7f8f0,0x65717c,1));const sun=new THREE.DirectionalLight(0xfff2d6,2.8);sun.position.set(-24,52,24);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-57,right:57,top:57,bottom:-57,near:1,far:125});sun.shadow.bias=-.003;sun.shadow.normalBias=.08;scene.add(sun);
let arena=null,actors=null,view=0,reverse=false,battery=false,views=[],frame=null,reviewAO=null;
const definitions={
 'tidal-lock':[
 ['West pump house',[-27,5.7,15],[-22,7,-1]],['East hydraulic bay',[27,5.7,-15],[22,7,1]],['Lock crossing',[0,5.7,20],[0,5,0]],['Upper maintenance',[-26,9.7,-10],[0,7,-17]],['Lower channel',[0,2.7,10],[0,3,-10]]],
 parallax:[['Compressors',[-26,2.7,-12],[-23,3,0]],['Heat exchange',[26,2.7,12],[23,3,0]],['Transfer hall',[0,2.7,12],[0,5,0]],['Upper tower',[25,10.7,-17],[0,5,-7]],['Service yard',[-4,2.7,18],[20,3,18]]],
 foundry:[['Forge hall',[-17,2.7,12],[-22,5,-3]],['Hydraulic press',[28,2.7,0],[22,5,-6]],['Dispatch',[-23,2.7,21],[0,3,19]],['Control room',[26,10.7,-21],[4,5,-10]],['Gantry crossing',[3,6.7,-6],[-20,5,-3]]],
 reservoir:[['North filtration',[-15,38.7,-43],[0,38,-48]],['South valve hall',[15,38.7,43],[0,38,48]],['Pump gallery',[31,32.7,10],[31,34,-10]],['Electrical gallery',[-31,32.7,-10],[-31,34,10]],['Transfer bridge',[0,35.7,-10],[0,35,8]],['Lower basin',[0,3.7,18],[0,8,0]]],
 shipment:[['North stacks',[-27,1.8,-20],[-17,4,-5]],['South loading',[13,1.8,23],[0,3,10]],['Power bay',[25,1.8,-15],[6,5,-12]],['Upper crossing',[-20,9.2,-4],[6,7,-12]],['Open container',[0,1.8,0],[10,2,0]]],

const available=[...MAPS,RUST,SHIPMENT].filter((m,i,a)=>a.findIndex(n=>n.id===m.id)===i),mapSelect=document.querySelector('#map'),select=document.querySelector('#view');for(const m of available)mapSelect.add(new Option(m.name,m.id));
function supportedView(position,blocks){const [x,eye,z]=position,feet=eye-1.7;let best=null,score=Infinity;for(let dx=-6;dx<=6;dx+=.5)for(let dz=-6;dz<=6;dz+=.5){const xx=x+dx,zz=z+dz;if(Math.abs(xx)>MAP.bounds.x-.6||Math.abs(zz)>MAP.bounds.z-.6)continue;const floor=surfaceAt(blocks,xx,zz,feet+.5);if(Math.abs(floor-feet)>1.2)continue;const near=nearBlocks(blocks,xx,zz,.4),supported=near.some(b=>{const span=blockSpan(b,xx,zz,.24);return span&&Math.abs(span.top-floor)<.03});if(!supported||!canOccupy(blocks,{x:xx,z:zz,feet:floor+.001,height:1.9,radius:.4}))continue;const s=dx*dx+dz*dz+(floor-feet)**2*10;if(s<score){score=s;best=[xx,floor+1.701,zz];}}return best||position;}
function setView(){const v=views[view];camera.position.fromArray(reverse?v.target:v.position);camera.lookAt(new THREE.Vector3(...(reverse?v.position:v.target)));camera.updateMatrixWorld(true);}
function loadMap(id){if(arena)scene.remove(arena);if(actors)scene.remove(actors);const selected=available.find(m=>m.id===id);selectMap(id);if(MAP.id!==id){for(const key of Object.keys(MAP))delete MAP[key];Object.assign(MAP,selected);}setArenaAtmosphere(scene,MAP);arena=new THREE.Group();scene.add(arena);const blocks=[],world=[];if(MAP.id==='testworks')buildTestworks(arena,MAP,blocks,world);else buildBrushMap(arena,MAP,blocks,world);const lifts=new ElevatorSystem(MAP.elevators||[],blocks);dressElevators(arena,lifts,world);actors=new THREE.Group();scene.add(actors);views=id==='testworks'?TESTWORKS_VIEWS:definitions[id].map(([label,position,target])=>({label,position,target}));for(const [i,v]of views.entries()){const d=new THREE.Vector3(...v.target).sub(new THREE.Vector3(...v.position));d.y=0;d.normalize();const pos=new THREE.Vector3(...v.position).addScaledVector(d,9);let floor=v.position[1]-1.7;const rig=createDummyRig({mat:surface,target:()=>{}});const supported=supportedView([pos.x,floor+1.7,pos.z],blocks);rig.group.position.set(supported[0],supported[1]-1.7,supported[2]);rig.group.traverse(m=>{if(m.userData.healthShell)m.material=surface(i%2?0x52d93c:0xd9d13c)});poseDummy(rig,{crouch:i===2?1:0});actors.add(rig.group);}for(const v of views)v.position=supportedView(v.position,blocks);select.innerHTML='';for(const [i,v]of views.entries())select.add(new Option(v.label,i));view=0;reverse=false;if(!frame){frame=new FrameRenderer(renderer,scene,camera,{ao:true,bloom:true});reviewAO=frame.gtao;}setView();}
mapSelect.onchange=()=>loadMap(mapSelect.value);select.onchange=()=>{view=+select.value;reverse=false;setView()};document.querySelector('#reverse').onclick=()=>{reverse=!reverse;setView()};document.querySelector('#actors').onclick=e=>{actors.visible=!actors.visible;e.target.textContent='ACTORS '+(actors.visible?'ON':'OFF')};document.querySelector('#quality').onclick=e=>{battery=!battery;e.target.textContent=battery?'BATTERY':'BALANCED';frame.gtao=battery?null:reviewAO;frame.output.uniforms.aoAmount.value=battery?0:.65;renderer.shadowMap.enabled=!battery;frame.bloomEnabled=!battery;frame.output.uniforms.bloomAmount.value=battery?0:1;};document.querySelector('#hide').onclick=()=>{document.querySelector('nav').hidden=true;document.querySelector('#info').hidden=true;};mapSelect.value='tidal-lock';loadMap('tidal-lock');
let free=false;document.querySelector('#free').onclick=e=>{free=!free;keys.clear();e.target.textContent='FREE CAMERA '+(free?'ON':'OFF');};let dragging=false,last;renderer.domElement.onpointerdown=e=>{if(!free)return;dragging=true;last=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>dragging=false;renderer.domElement.onpointermove=e=>{if(!free||!dragging)return;const a=new THREE.Euler().setFromQuaternion(camera.quaternion,'YXZ');a.y-=(e.clientX-last[0])*.003;a.x=Math.max(-1.4,Math.min(1.4,a.x-(e.clientY-last[1])*.003));camera.quaternion.setFromEuler(a);last=[e.clientX,e.clientY]};
const keys=new Set();onkeydown=e=>keys.add(e.code);onkeyup=e=>keys.delete(e.code);let old=performance.now();renderer.info.autoReset=false;renderer.setAnimationLoop(now=>{const dt=Math.min((now-old)/1000,.1);old=now;const d=new THREE.Vector3((keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),0,(keys.has('KeyS')?1:0)-(keys.has('KeyW')?1:0));d.applyQuaternion(camera.quaternion);if(free)camera.position.addScaledVector(d,dt*8);renderer.info.reset();frame.render(scene,camera,dt);document.querySelector('#info').textContent=MAP.name+' / '+views[view].label+' / '+renderer.info.render.calls+' total calls / '+renderer.info.render.triangles+' triangles / '+camera.position.toArray().map(v=>v.toFixed(1)).join(', ');});
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);frame.resize()};

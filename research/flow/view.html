<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spatial investigation</title><style>body{margin:0;background:#16212a;color:white;font:13px system-ui}canvas{display:block}aside{position:fixed;top:0;left:0;right:0;background:#15212de8;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5}select,button,input{font:inherit;padding:5px;max-width:230px}#status{position:fixed;bottom:8px;left:10px;white-space:pre;background:#15212ddd;padding:8px;pointer-events:none}#cross{position:fixed;top:50%;left:50%;pointer-events:none}label{display:flex;align-items:center;gap:5px}</style></head><body><aside><label>Map <select id="map"></select></label><label>Place <select id="place"></select></label><label>Look <select id="look"><option value="0">North</option><option value="1.5707963267948966">West</option><option value="3.141592653589793">South</option><option value="-1.5707963267948966">East</option></select></label><button id="prev">Previous place</button><button id="next">Next place</button><button id="rise">Look up</button><button id="level">Level</button><button id="lower">Look down</button><label><input id="noclip" type="checkbox">Fly</label><button id="doors">Open doors</button><button id="lifts">Lower lifts</button><label>Entity <input id="entity" type="number" min="0" value="0" style="width:65px"></label><button id="entity-go">Inspect entity</button><label>Route <select id="route"><option>None</option></select></label><label>Frame <input id="frame" type="number" min="0" value="0" style="width:70px"></label><button id="step">Next route frame</button><button id="trace">Trace</button></aside><div id="cross">+</div><output id="status">Loading</output><script type="module" src="view.js"></script></body></html>

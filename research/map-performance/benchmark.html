<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Native map benchmark</title><style>html,body{margin:0;width:100%;height:100%;background:#172027}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}output{position:fixed;right:12px;bottom:12px;background:#172027dd;color:#fff;padding:8px;font:12px system-ui;pointer-events:none}</style></head><body><iframe title="Native graphics benchmark"></iframe><output>Preparing native benchmark…</output><script>
const query=new URLSearchParams(location.search),root=query.get('root')||'build',frame=document.querySelector('iframe'),token='map-performance-qa';
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data?.token!==token)return;const data=event.data;if(data.type==='progress')document.querySelector('output').textContent=(data.progress.index+1)+' / '+data.progress.total+' · '+data.progress.scene.map+' · '+data.progress.phase;if(data.type==='error'){window.graphicsError=data.message;document.querySelector('output').textContent=data.message;}if(data.type==='complete'){window.graphicsReport=data.report;document.querySelector('output').textContent='Complete · native game benchmark';}});
frame.src='../../'+root+'/?benchmark='+token;
</script></body></html>

<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Actor rendering equivalence</title><style>body{margin:0;background:#182127}canvas{display:block}</style></head><body><script type="module">
import * as T from '../../dist/vendor/three.module.js';import{FrameRenderer,studioEnvironment}from'../../dist/presentation.js';import{createDummyRig,poseDummy}from'../../dist/characters.js';
const r=new T.WebGLRenderer({antialias:false});r.setSize(800,500);r.shadowMap.enabled=true;r.shadowMap.type=T.PCFShadowMap;document.body.append(r.domElement);const scene=new T.Scene(),camera=new T.PerspectiveCamera(65,1.6,.07,100);scene.background=new T.Color(0x9ab4d0);scene.environment=studioEnvironment(r).texture;scene.environmentIntensity=.34;camera.position.set(2,1.8,1);camera.lookAt(0,1,-3.5);scene.add(camera,new T.HemisphereLight(0xf7f8f0,0x65717c,1.4));const sun=new T.DirectionalLight(0xfff2d6,2.8);sun.position.set(-4,8,4);sun.target.position.set(0,0,-4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:25});scene.add(sun,sun.target);
const material=new T.MeshStandardMaterial({color:0x64737c,roughness:1});for(const [x,y,z,w,h,d]of [[0,-.2,-4,12,.4,14],[-.5,.4,-2.4,1.5,.8,.4]]){const m=new T.Mesh(new T.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);}
const mats=new Map(),mat=c=>{if(!mats.has(c))mats.set(c,new T.MeshStandardMaterial({color:c,roughness:.73}));return mats.get(c);},target=new T.CircleGeometry(1,24),targetMat=new T.MeshBasicMaterial({color:0xd9ef45,side:T.DoubleSide}),rig=createDummyRig({mat,target(parent,x,y,z,size,ry=0){const m=new T.Mesh(target,targetMat);m.position.set(x,y,z);m.rotation.y=ry;m.scale.setScalar(size);parent.add(m);}});rig.group.position.set(0,0,-3.5);rig.group.rotation.y=.2;scene.add(rig.group);const frame=new FrameRenderer(r,scene,camera,{ao:false,bloom:false,msaa:2}),actors=frame.actorBatches;
let state='';window.actorFixture={draw(enabled,health=100,pose='stand'){const next=health+':'+pose;if(next!==state){state=next;for(const p of Object.values(rig.parts))p.visible=true;rig.anim.slide=pose==='slide'?1:0;poseDummy(rig,{dt:1,crouch:pose==='crouch'?1:0,pitch:.2,grounded:true});rig.group.traverse(m=>{if(m.userData.healthShell)m.material.color.setHSL(health/100*.32,.78,.48);});if(pose==='broken')rig.parts.leftArm.visible=false;}frame.actorBatches=enabled?actors:null;for(let i=0;i<3;i++)frame.render(scene,camera,0);return{error:r.getContext().getError(),mask:frame.maskReady};}};
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fragony / Water & Sky Review</title><style>body{margin:0;background:#182127;color:#eef0e6;font:12px sans-serif}canvas{display:block}nav{position:fixed;top:12px;left:12px;display:flex;gap:6px;z-index:2}button{padding:10px;background:#182127dc;color:#eef0e6;border:1px solid #a5b0b0;cursor:pointer}#status{position:fixed;bottom:14px;left:14px;background:#182127dc;padding:9px}</style></head><body><nav><button id="above">Above water</button><button id="surface">At surface</button><button id="below">Underwater</button><button id="sky">Sky composition</button><button id="style">Pixel Forge ON</button></nav><div id="status">Loading actual game scene…</div><script type="module">
import * as THREE from './vendor/three.module.js';import{FrameRenderer,studioEnvironment}from'./presentation.js';import{buildBrushMap}from'./map-view.js';import{RESERVOIR}from'./maps/reservoir.js';import{SHIPMENT}from'./maps/shipment.js';import{setArenaAtmosphere}from'./testworks.js';
const r=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(innerWidth,innerHeight);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(r.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0,62,155);setArenaAtmosphere(scene,RESERVOIR);scene.environment=studioEnvironment(r).texture;scene.environmentIntensity=.34;scene.add(new THREE.HemisphereLight(0xf7f8f0,0x65717c,1.35));const sun=new THREE.DirectionalLight(0xfff2d6,2.8);sun.position.set(-24,52,24);scene.add(sun);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.07,220);scene.add(camera);
const arena=new THREE.Group();scene.add(arena);buildBrushMap(arena,RESERVOIR,[],[]);const frame=new FrameRenderer(r,scene,camera,{ao:false,bloom:true,msaa:2});let view='above',skyArena;
const views={above:[[15,18,25],[0,13.75,15]],surface:[[15,14.6,25],[0,14,12]],below:[[15,11.5,25],[0,15,15]],sky:[[4.78,2.2,20.84],[0,10,0]]};async function set(id){if(id==='sky'&&!skyArena){if(SHIPMENT.loadRender)await SHIPMENT.loadRender();skyArena=new THREE.Group();scene.add(skyArena);buildBrushMap(skyArena,SHIPMENT,[],[]);}arena.visible=id!=='sky';if(skyArena)skyArena.visible=id==='sky';setArenaAtmosphere(scene,id==='sky'?SHIPMENT:RESERVOIR);view=id;camera.position.fromArray(views[id][0]);camera.lookAt(new THREE.Vector3(...views[id][1]));camera.updateMatrixWorld();frame.resetHistory();document.querySelector('#status').textContent=(id==='sky'?'SHIPMENT':'RESERVOIR')+' / '+id.toUpperCase()+' / ACTUAL GAME RENDERER';}for(const id of Object.keys(views))document.querySelector('#'+id).onclick=()=>set(id);document.querySelector('#style').onclick=e=>{frame.pixelForgeIntensity=frame.pixelForgeIntensity?0:1;e.target.textContent='Pixel Forge '+(frame.pixelForgeIntensity?'ON':'OFF');};set('above');r.setAnimationLoop(()=>frame.render(scene,camera,1/60,false,view==='sky'?[]:RESERVOIR.water));onresize=()=>{r.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();frame.resize();};
</script></body></html>
